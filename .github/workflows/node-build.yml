# Node.js port (node/): lint, typecheck, unit tests, and the differential contract suite against the Spring app.
name: Node port CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [ h2, postgres, mysql ]
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - name: Build the Spring app
        working-directory: .
        run: ./mvnw -B -q -DskipTests package
      - name: Contract tests (Java vs Node, ${{ matrix.profile }})
        run: npm run contract:run -- ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-results-${{ matrix.profile }}
          path: node/contract/results/
